name: CI

on:
  push:
    branches: ["master", "main", "pytracer-2", "claude/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Import side-effect gate
        run: |
          cd "$(mktemp -d)"
          python -c "import pytracer" && [ -z "$(ls -A)" ]
      - name: CLI smoke
        run: |
          pytracer --help
          pytracer doctor
      - name: Tests
        run: pytest -q

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with gui and scientific stacks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]" scipy scikit-learn
      - name: Full tests (dashboard, export, sci plugins, native census)
        run: pytest -q --cov=pytracer --cov-report=term

  benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Capture performance matrix
        run: python benchmarks/bench.py --iterations 2000 --repeats 5 --markdown
